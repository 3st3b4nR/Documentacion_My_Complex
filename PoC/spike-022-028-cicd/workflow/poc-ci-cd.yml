name: mycomplex-ci-cd-poc

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: ./mvnw --batch-mode verify

  publish-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    environment: poc
    steps:
      - uses: actions/checkout@v4
      - name: Validate SemVer tag
        shell: pwsh
        run: ./PoC/spike-022-028-cicd/scripts/verify-semver.ps1 -Version '${{ github.ref_name }}'
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Build and publish immutable image
        run: az acr build --registry "${{ vars.ACR_NAME }}" --image "mycomplex-api:${{ github.ref_name }}" --image "mycomplex-api:${{ github.sha }}" .
      - name: Deploy tagged image
        run: >-
          az containerapp update
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_CONTAINER_APP }}"
          --image "${{ vars.ACR_NAME }}.azurecr.io/mycomplex-api:${{ github.ref_name }}"
