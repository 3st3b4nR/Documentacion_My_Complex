spring.application.name=poc-006-auth0-mycomplex

# Tenant Name visto en Auth0: mycomplex-dev
#
# IMPORTANTE:
# El issuer debe ser el DOMAIN exacto que aparece en Auth0 Dashboard > Settings > Domain.
# Con el nombre del tenant "mycomplex-dev", el dominio usual sería:
# https://mycomplex-dev.us.auth0.com/
#
# Si Auth0 te muestra un dominio distinto, reemplaza AUTH0_ISSUER.
auth0.issuer=${AUTH0_ISSUER:https://mycomplex-dev.us.auth0.com/}

# Identifier/Audience que debes crear en Applications > APIs > MyComplex API
auth0.audience=${AUTH0_AUDIENCE:https://api.mycomplex.com}

server.port=${SERVER_PORT:8080}
