spring.application.name=poc-010-resend-email-mycomplex
server.port=${SERVER_PORT:8083}

resend.api-key=${RESEND_API_KEY:}

# Para una prueba inicial, Resend permite usar su dominio de onboarding.
# Si luego verificas un dominio propio, reemplaza este valor.
resend.from=${RESEND_FROM:MyComplex <onboarding@resend.dev>}

resend.api-url=${RESEND_API_URL:https://api.resend.com/emails}
